---
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tools via mise
        uses: jdx/mise-action@v4
        with:
          install_args: 'rust cargo:flip-link mdbook'

      - name: Install Rust cross-compilation target
        run: |
          rustup target add --toolchain stable thumbv7em-none-eabihf
          rustup component add --toolchain stable rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run host unit tests
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          # iot-net pulls embassy-net (no host build); it is covered
          # by the embedded clippy/build workspace runs below.
          cargo test --workspace --target "$HOST_TARGET" --exclude feather-stm32f405 --exclude nucleo-h753zi --exclude iot-net
          # iot-core's ars/ and sen66 modules are feature-gated and
          # invisible to the default-feature run above; exercise them.
          cargo test -p iot-core --all-features --target "$HOST_TARGET"

      # Board crates select mutually-exclusive stm32-metapac chip
      # features, so two boards can never share one cargo
      # invocation (feature unification trips the metapac
      # multiple-chips guard).  Each additional board gets its own
      # -p invocation below.
      - name: Run clippy
        run: |
          cargo clippy --workspace --exclude nucleo-h753zi --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy -p nucleo-h753zi --target thumbv7em-none-eabihf -- -D warnings
          # Compile iot-core's feature-gated modules under clippy too,
          # so ars/ cannot rot behind a feature no board enables.
          cargo clippy -p iot-core --all-features --target thumbv7em-none-eabihf -- -D warnings

      - name: Build (debug)
        run: |
          cargo build --workspace --exclude nucleo-h753zi --target thumbv7em-none-eabihf
          cargo build -p nucleo-h753zi --target thumbv7em-none-eabihf

      - name: Build (release)
        run: |
          cargo build --workspace --exclude nucleo-h753zi --target thumbv7em-none-eabihf --release
          cargo build -p nucleo-h753zi --target thumbv7em-none-eabihf --release
