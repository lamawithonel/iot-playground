---
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools via mise
        uses: jdx/mise-action@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --target thumbv7em-none-eabihf -- -D warnings

      - name: Build (debug)
        run: cargo build --workspace --target thumbv7em-none-eabihf

      - name: Build (release)
        run: cargo build --workspace --target thumbv7em-none-eabihf --release
