---
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tools via mise
        uses: jdx/mise-action@v4
        with:
          install_args: 'rust cargo:flip-link mdbook'

      - name: Install Rust cross-compilation target
        run: |
          rustup target add --toolchain stable thumbv7em-none-eabihf
          rustup component add --toolchain stable rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --target thumbv7em-none-eabihf -- -D warnings

      - name: Build (debug)
        run: cargo build --workspace --target thumbv7em-none-eabihf

      - name: Build (release)
        run: cargo build --workspace --target thumbv7em-none-eabihf --release
