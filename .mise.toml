# mise configuration for iot-playground
# https://mise.jdx.dev/

[env]
CARGO_TERM_COLOR = 'always'
DEFMT_LOG = 'info'
_.source = 'test/scripts/env-defaults.sh'

[tools]
rust = { version = "stable", targets = "thumbv7em-none-eabihf", components = "rustfmt,clippy" }
"cargo:flip-link" = "0.1.12"
"cargo:probe-rs-tools" = "0.25.0"
mdbook = '0.4.40'

# ──────────────────────────────────────────────────────
# Tasks
# ──────────────────────────────────────────────────────
# Rust build/check/flash tasks are handled by cargo and
# probe-rs directly.  Mise tasks are for non-Rust tools
# only (docs, broker, TLS certs, etc.).

# ── TLS Certificate Management ───────────────────────
# Usage specs below enable tab-completion for mise.
# If gen-tls-cert.sh arguments change, update the usage
# specs to match.

[tasks."tls:ca"]
description = 'Generate root CA certificate'
usage = '''
flag "--curve <curve>" help="Elliptic curve" default="P-256" {
  choices "P-256" "P-384" "P-521"
}
flag "--hash <hash>" help="Hash algorithm" default="SHA256" {
  choices "SHA256" "SHA384" "SHA512"
}
flag "--force" help="Regenerate even if files exist"
flag "--cn <cn>" help="Common Name (default: platform-detected IP)"
flag "--san <san>" help="Subject Alt Name (default: IP:<detected>)"
flag "--days <days>" help="Validity in days" default="3650"
'''
run = '''
test/scripts/gen-tls-cert.sh ca \
  --curve "${usage_curve?}" \
  --hash "${usage_hash?}" \
  ${usage_cn:+--cn "$usage_cn"} \
  ${usage_san:+--san "$usage_san"} \
  --days "${usage_days?}" \
  ${usage_force:+--force}
'''

[tasks."tls:server"]
description = 'Generate a server certificate signed by the CA'
depends = ['tls:ca']
usage = '''
arg "<name>" help="Certificate name (e.g., broker)"
flag "--curve <curve>" help="Elliptic curve" default="P-256" {
  choices "P-256" "P-384" "P-521"
}
flag "--hash <hash>" help="Hash algorithm" default="SHA256" {
  choices "SHA256" "SHA384" "SHA512"
}
flag "--force" help="Regenerate even if files exist"
flag "--cn <cn>" help="Common Name (default: platform-detected IP)"
flag "--san <san>" help="Subject Alt Name (default: IP:<detected>)"
flag "--days <days>" help="Validity in days" default="3650"
'''
run = '''
test/scripts/gen-tls-cert.sh server "${usage_name:?}" \
  --curve "${usage_curve?}" \
  --hash "${usage_hash?}" \
  ${usage_cn:+--cn "$usage_cn"} \
  ${usage_san:+--san "$usage_san"} \
  --days "${usage_days?}" \
  ${usage_force:+--force}
'''

[tasks."tls:client"]
description = 'Generate a client certificate signed by the CA'
depends = ['tls:ca']
usage = '''
arg "<name>" help="Certificate name (e.g., device)"
flag "--curve <curve>" help="Elliptic curve" default="P-384" {
  choices "P-256" "P-384" "P-521"
}
flag "--hash <hash>" help="Hash algorithm" default="SHA384" {
  choices "SHA256" "SHA384" "SHA512"
}
flag "--force" help="Regenerate even if files exist"
flag "--cn <cn>" help="Common Name (default: platform-detected IP)"
flag "--san <san>" help="Subject Alt Name (default: IP:<detected>)"
flag "--days <days>" help="Validity in days" default="3650"
'''
run = '''
test/scripts/gen-tls-cert.sh client "${usage_name:?}" \
  --curve "${usage_curve?}" \
  --hash "${usage_hash?}" \
  ${usage_cn:+--cn "$usage_cn"} \
  ${usage_san:+--san "$usage_san"} \
  --days "${usage_days?}" \
  ${usage_force:+--force}
'''

[tasks."tls:server:broker"]
description = 'Generate server certificate for Mosquitto broker'
depends = ['tls:ca']
run = '''
#!/usr/bin/env bash
set -o errexit

extra_args=()
if [ -n "${BROKER_HOST_IP:-}" ]; then
  extra_args+=(--cn "$BROKER_HOST_IP" --san "IP:${BROKER_HOST_IP}")
else
  echo "warning: BROKER_HOST_IP is not set; using gen-tls-cert.sh defaults." >&2
  echo "         Set BROKER_HOST_IP or BROKER_INTERFACE to control the cert CN/SAN." >&2
fi

test/scripts/gen-tls-cert.sh server broker "${extra_args[@]}" "$@"
'''

[tasks."tls:client:device"]
description = 'Generate client certificate for test device'
depends = ['tls:ca']
run = 'test/scripts/gen-tls-cert.sh client device "$@"'

# ── Documentation ────────────────────────────────────

[tasks.docs]
description = 'Build and serve the mdBook documentation'
run = '''
#!/usr/bin/env bash
set -o errexit
set -o nounset
set -o pipefail

mdbook serve docs --open
'''

[tasks."docs:build"]
description = 'Build the mdBook documentation'
run = 'mdbook build docs'

# ── Testing ───────────────────────────────────────────

[tasks.test]
description = 'Run host unit tests for platform-agnostic crates'
run = '''
#!/usr/bin/env bash
set -o errexit
set -o nounset
set -o pipefail

_host_target="$(rustc -vV | sed -n 's/^host: //p')"
exec cargo test --workspace --target "$_host_target" "$@"
'''

# ── Mosquitto MQTT Broker ────────────────────────────

[tasks."broker:start"]
description = 'Start the Mosquitto MQTT test broker'
depends = ['tls:server:broker']
run = '''
#!/usr/bin/env bash
set -o errexit
set -o nounset
set -o pipefail

exec test/broker/start-broker.sh
'''

[tasks."broker:stop"]
description = 'Stop the Mosquitto MQTT test broker'
run = '''
#!/usr/bin/env bash
set -o errexit
set -o nounset
set -o pipefail

exec test/broker/stop-broker.sh
'''

[tasks."broker:logs"]
description = 'View Mosquitto MQTT test broker logs'
run = '''
#!/usr/bin/env bash
set -o errexit
set -o nounset
set -o pipefail

_container='mosquitto-tls'

# Find which runtime owns the container.
if [ -n "${CONTAINER_RUNTIME:-}" ]; then
  case "$CONTAINER_RUNTIME" in
    podman|docker) ;;
    *)
      printf 'ERROR: CONTAINER_RUNTIME=%s is not supported.\n' \
        "$CONTAINER_RUNTIME" >&2
      echo 'Set CONTAINER_RUNTIME to "podman" or "docker".' >&2
      exit 1
      ;;
  esac
  if ! command -v "$CONTAINER_RUNTIME" >/dev/null 2>&1; then
    printf 'ERROR: CONTAINER_RUNTIME=%s but %s is not installed.\n' \
      "$CONTAINER_RUNTIME" "$CONTAINER_RUNTIME" >&2
    exit 1
  fi
  _rt="$CONTAINER_RUNTIME"
else
  _rt=''
  for _c in podman docker; do
    if command -v "$_c" >/dev/null 2>&1 \
        && "$_c" ps -a --format '{{.Names}}' 2>/dev/null \
        | grep -q "^${_container}$"; then
      _rt="$_c"
      break
    fi
  done
  if [ -z "$_rt" ]; then
    echo 'Broker is not running.'
    exit 0
  fi
fi

exec "$_rt" logs -f "$_container"
'''
