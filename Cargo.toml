[workspace]
resolver = "2"
members = [
    "boards/feather-stm32f405",
    "boards/nucleo-h753zi",
    "core",
    "hal-abstractions",
    "iot-net",
]
exclude = [
    "boards/nucleo-n657x0",
    "test/mqtt-subscriber",
    "test/smoke-validator",
    "tools/ars-synth",
]
# Default member for cargo embed and other commands from workspace root
default-members = ["boards/feather-stm32f405"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lamawithonel/iot-playground"

[workspace.dependencies]
# Common dependencies shared across workspace members
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
hal-abstractions = { path = "hal-abstractions" }
heapless = "0.9.3"
static_cell = "2.1.1"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
critical-section = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# RTIC ecosystem
[workspace.dependencies.rtic]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"

[workspace.dependencies.rtic-monotonics]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"

[workspace.dependencies.rtic-sync]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"

[workspace.dependencies.rtic-time]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"

# Embassy ecosystem (HAL only, no executor)
[workspace.dependencies.embassy-stm32]
version = "0.6.0"
default-features = false

[workspace.dependencies.embassy-net]
version = "0.9.1"

[workspace.dependencies.embassy-net-wiznet]
version = "0.3.0"

[workspace.dependencies.embassy-time]
version = "0.5.1"

[workspace.dependencies.embassy-sync]
version = "0.8.0"

[workspace.dependencies.embassy-futures]
version = "0.1.2"

[workspace.dependencies.embassy-embedded-hal]
version = "0.6.0"

[profile.dev]
opt-level = 1
debug = true
lto = false
panic = "abort"
codegen-units = 16

# Crypto crates use heavy const-eval and field arithmetic that is
# painfully slow (or times out) without optimizations.
[profile.dev.package.crypto-bigint]
opt-level = 2
[profile.dev.package.elliptic-curve]
opt-level = 2
[profile.dev.package.p256]
opt-level = 2

[profile.release]
opt-level = "s"    # optimize for size
debug = true       # symbols are nice and they don't increase the size on Flash
lto = true         # better optimizations
codegen-units = 1  # better optimizations
panic = "abort"
