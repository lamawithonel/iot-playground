#
# Root Embed.toml-- defaults for `cargo embed` run from the
# workspace root, which builds the default member
# (feather-stm32f405).
#
# Each board directory carries its own Embed.toml; run
# `cargo embed` from the board directory when working on a
# non-default board.  The old PROBE_RS_CONFIG_PRESET preset
# mechanism is broken under probe-rs 0.31 (preset selection
# errors out); select probe and chip with `--probe`/`--chip`
# flags or the PROBE_RS_PROBE/PROBE_RS_CHIP environment
# variables instead.
#
# On a bench with more than one debug probe attached, an
# unpinned invocation falls into probe-rs's interactive
# selection prompt.  Pin the probe in an untracked
# `Embed.local.toml` or via PROBE_RS_PROBE (e.g. 1366:1020 for
# a J-Link).
#

[default.general]
chip = "STM32F405RGTx"

[default.probe]
protocol = "Swd"

[default.rtt]
enabled = true
up_channels = [
  { channel = 0, name = "defmt", format = "Defmt" },
]

[default.gdb]
enabled = false
