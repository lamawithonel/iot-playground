[package]
name = "feather-stm32f405"
version.workspace = true
edition.workspace = true
readme = "README.md"

# this lets you use `cargo fix`!
[[bin]]
bench = false
name = "feather-stm32f405"
test = false

[dependencies]
cortex-m.workspace = true
critical-section.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
heapless.workspace = true
iot-core = { path = "../../core", features = ["defmt", "embedded-io", "sen66"] }
iot-net = { path = "../../iot-net" }
panic-probe.workspace = true
static_cell.workspace = true

[dependencies.embassy-embedded-hal]
workspace = true
features = ["defmt"]

[dependencies.embassy-futures]
workspace = true

[dependencies.embassy-net]
workspace = true
features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
]

[dependencies.embassy-net-wiznet]
workspace = true
features = ["defmt"]

[dependencies.embassy-stm32]
workspace = true
features = [
  "defmt",
  "exti",
  "rt",                # Required for NVIC_PRIO_BITS
  "stm32f405rg",
  "time-driver-tim3",
  "unstable-pac",
]

[dependencies.embassy-sync]
workspace = true
features = ["defmt"]
# Note: Required by embassy-embedded-hal for SPI bus sharing within network task
# Uses lightweight CriticalSection-based mutex that doesn't prevent WFI sleep

[dependencies.embassy-time]
workspace = true
features = [
  "defmt",
  "defmt-timestamp-uptime",
  "generic-queue-16",
]

[dependencies.rtic]
workspace = true
features = ["thumbv7-backend"]

[dependencies.rtic-monotonics]
workspace = true
features = [
  "cortex-m-systick",
  "defmt",
  "stm32_tim2",
  "stm32f405rg",
]

[dependencies.rtic-sync]
workspace = true
features = ["defmt-03"]

[dependencies.rtic-time]
workspace = true

# SEN66 environmental sensor (I2C, async)
[dependencies.sen6x]
version = "0.1.4"
default-features = false
features = ["async", "sen66", "defmt"]

# SNTP client for time synchronization (SR-NET-006).
# Staged for future use: iot-net/src/sntp.rs currently hand-rolls
# SNTP over embassy-net UDP (reply validation lives in
# iot_core::network::sntp) and does not import this crate yet.
# Version 0.11.0 renamed the no-std/embedded features to "sync".
[dependencies.sntpc]
version = "0.11.0"
default-features = false

[dependencies.stm32-metapac]
version = "21.0.0"
features = [
  "defmt",
  "rt",
  "stm32f405rg",
]

# ── On-Device Tests ──────────────────────────────────
# Uses embedded-test (probe-rs native) instead of deprecated
# defmt-test.  Each test resets the MCU for full isolation.
# Run with: cargo test -p feather-stm32f405

[[test]]
name = "bringup"
harness = false

[dev-dependencies.embedded-test]
version = "0.7.1"
default-features = false
features = ["semihosting", "defmt"]

# cortex-m-rt is needed in test binaries for the vector table
# and DefaultHandler symbol that link.x requires.
[dev-dependencies.cortex-m-rt]
version = "0.7.5"

# stm32-metapac provides the device-specific interrupt vector
# table (DefaultHandler_) that cortex-m-rt's link.x expects.
[dev-dependencies.stm32-metapac]
version = "21.0.0"
features = ["rt", "stm32f405rg"]
