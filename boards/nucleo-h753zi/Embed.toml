# NOTICE: Do not edit this file unless the changes are safe in all environments!
#
# Instead, copy this file to `Embed.local.toml` or `.embed.local.toml`,
# then make your edits.  Those files will override this file and are not
# tracked in Git, so you can customize them to your preferences.
#

[default.general]
chip = "STM32H753ZITx"

[default.probe]
protocol = "Swd"
# Pin to the on-board ST-LINK so a multi-probe bench never grabs
# a J-Link attached to another board.
usb_vid = "0483"
usb_pid = "374e"

[default.rtt]
enabled = true
up_channels = [
  { channel = 0, name = "defmt", format = "Defmt" },
]

[default.gdb]
enabled = false
