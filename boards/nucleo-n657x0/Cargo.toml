[package]
name = "nucleo-n657x0"
version = "0.1.0"
edition = "2021"
readme = "README.md"

# This crate is workspace-excluded (see the root Cargo.toml), so
# it cannot use `.workspace = true` inheritance; version and
# edition are stated explicitly, matching the workspace values.

[[bin]]
bench = false
name = "nucleo-n657x0"
test = false

