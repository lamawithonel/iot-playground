[package]
name = "nucleo-n657x0"
version = "0.1.0"
edition = "2021"
readme = "README.md"

# This crate is workspace-excluded (see the root Cargo.toml), so
# it cannot use `.workspace = true` inheritance; version and
# edition are stated explicitly, matching the workspace values.

[[bin]]
bench = false
name = "nucleo-n657x0"
test = false

# ── Gate G1 compile spike ─────────────────────────────────────────
# All real deps are optional, pulled in only by the "g1-spike"
# feature, so plain `cargo check` (no features) stays dependency-
# free and hits the scaffold `compile_error!` guard unchanged.  See
# docs/src/projects/ars-toolhead-sensor/pinout.md gate G1 and
# src/main.rs.
#
# Version note (G1 finding): stm32n6* support first appeared in
# embassy-stm32 0.5.0.  The workspace (feather, nucleo-h753zi) was
# bumped to embassy-stm32 0.6.0 as part of the Phase 2 dependency
# migration, so this board's pin matched the rest of the workspace
# for a time-- this crate stays workspace-excluded until its own
# hardware bring-up spike lands, not because of a version gap.
#
# Escape-hatch pin (crate-local only, does not affect the root
# workspace): the released 0.6.0 has no N6 Ethernet driver-- see
# docs/src/boards/nucleo-n657x0.md's "embassy-stm32 / stm32-metapac
# Coverage Gaps" section.  embassy git main carries a working N6
# ETH driver (PR #6305 "eth_v2a driver and example", merged via
# #6557), so every embassy crate this crate depends on is pinned to
# the SAME git revision below rather than the crates.io release.
# This crate is workspace-excluded with its own Cargo.lock, so the
# pin is fully isolated from the rest of the workspace.

[features]
g1-spike = [
  "dep:cortex-m",
  "dep:cortex-m-rt",
  "dep:critical-section",
  "dep:defmt",
  "dep:defmt-rtt",
  "dep:embassy-stm32",
  "dep:panic-probe",
  "dep:rtic",
  "dep:rtic-monotonics",
]

# ── Gate G1 networking spike (additive) ──────────────────────────
# On-chip ETH1 (RMII to the on-board Microchip LAN8742A PHY) driving
# an embassy-net DHCPv4 stack from an RTIC software task.  Strictly
# additive: it builds on g1-spike's proven init/boot path and adds
# no changes to the phase-1 tasks, so `--features g1-spike` alone is
# unaffected.  See src/net.rs and main.rs's `network_task`, and
# docs/src/boards/nucleo-n657x0.md.
#
# ETH itself is not a Cargo feature of embassy-stm32 (the `eth_v2a`
# driver is chip-metadata-driven, enabled automatically by
# `stm32n657x0`); only the extra crates need pulling in.  Every
# embassy crate stays on the SAME git rev as embassy-stm32 above.
#
# `net` now also carries the full DHCP -> SNTP -> MQTT-over-TLS
# telemetry pipeline, reusing the shared `iot-net` clients (a path
# dep) exactly as `feather-stm32f405` does.  `iot-net` is a workspace
# member, so its embassy deps resolve to the workspace's crates.io
# versions (embassy-net 0.9.1, embassy-time 0.5.1, ...).  Those would
# be a *distinct* graph from this crate's git-rev embassy, so their
# `Stack`/`Runner`/time-driver types would not unify and the link
# would double up the time driver.  The `[patch.crates-io]` section
# at the end of this manifest redirects exactly that crates.io
# subgraph onto the SAME git rev; the rev's crate versions match the
# workspace's byte for byte (0.9.1 / 0.5.1 / 0.1.2 / ...), so the
# patch is semver-clean.  The patch is crate-local (this crate is
# workspace-excluded with its own Cargo.lock), so the workspace is
# untouched.
net = [
  "g1-spike",
  "dep:embassy-futures",
  "dep:embassy-net",
  "dep:embassy-time",
  "dep:static_cell",
  "dep:heapless",
  "dep:iot-core",
  "dep:iot-net",
  "dep:rtic-sync",
]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
# set-vtor: in dev boot (BOOT1=1) the N6 boot ROM leaves VTOR at its
# own table; without this, the image's first exception vectors into
# ROM and hard-faults (bench finding, G0 bring-up 2026-07-21).
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"], optional = true }
critical-section = { version = "1.1", optional = true }
defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.1", optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"], optional = true }

[dependencies.embassy-stm32]
git = "https://github.com/embassy-rs/embassy"
rev = "12e4b1adde4e01b23506822c621451f8e6199c81"
default-features = false
# exti: phase-1's USER_BTN (PC13/EXTI13) uses embassy's async
# ExtiInput, matching feather's own "exti" precedent for
# counting_exti.rs.
features = ["defmt", "exti", "rt", "stm32n657x0", "time-driver-tim9"]
optional = true

[dependencies.embassy-futures]
git = "https://github.com/embassy-rs/embassy"
rev = "12e4b1adde4e01b23506822c621451f8e6199c81"
optional = true

[dependencies.embassy-net]
git = "https://github.com/embassy-rs/embassy"
rev = "12e4b1adde4e01b23506822c621451f8e6199c81"
default-features = false
# dhcpv4 implies proto-ipv4 + medium-ethernet.  auto-icmp-echo-reply
# makes smoltcp's interface answer ICMP echo (the host-side ping
# check) with no socket; it is in embassy-net's DEFAULT feature set,
# so `default-features = false` drops it and must re-add it (bench
# finding 2026-07-21: without it the board answered ARP but never
# ping).  tcp/udp/dns and medium-ethernet arrive transitively via
# iot-net's embassy-net features, unified onto this same git rev by
# the [patch.crates-io] section below; this block lists only the
# board's own direct needs.
features = ["defmt", "dhcpv4", "auto-icmp-echo-reply"]
optional = true

[dependencies.embassy-time]
git = "https://github.com/embassy-rs/embassy"
rev = "12e4b1adde4e01b23506822c621451f8e6199c81"
# tick-hz-1_000_000 divides the Default-config HCLK (HSI, 64 MHz)
# cleanly in the TIM9 gp16 time driver (psc = 64e6/1e6 - 1 = 63) and
# gives 1 us resolution.  embassy-net needs embassy-time's timer
# queue, and exactly one tick-hz-* must be selected somewhere in the
# graph; the board is the only place that can choose it.
#
# generic-queue-16 is REQUIRED under RTIC: without a generic-queue-*
# feature, embassy-time defaults to its `queue_integrated` mode,
# whose timer queue is provided by embassy-executor via the
# `__embassy_time_queue_item_from_waker` symbol-- undefined here
# because embassy-executor is forbidden, so the link fails.  The
# generic queue is self-contained and executor-agnostic; this
# mirrors the feather-stm32f405 RTIC precedent.
features = ["defmt", "generic-queue-16", "tick-hz-1_000_000"]
optional = true

[dependencies.static_cell]
version = "2"
optional = true

[dependencies.heapless]
version = "0.9"
optional = true

# Shared, hardware-free network clients (MQTT/TLS/SNTP over
# embassy-net).  Path dep on the workspace member; its crates.io
# embassy deps are unified onto this crate's git rev by the
# `[patch.crates-io]` at the end of this manifest.
[dependencies.iot-net]
path = "../../iot-net"
optional = true

# Pulled directly (not just transitively via iot-net) so this crate
# can name `EnvironmentalReading` (the telemetry-payload trait) and
# `Timestamp` (the SNTP/`now` wall-clock type) itself.
[dependencies.iot-core]
path = "../../core"
default-features = false
features = ["defmt"]
optional = true

# rtic-sync channel carries telemetry readings from the producer to
# the MQTT publish loop (feather's sensor_rx precedent).  Same git
# tag as rtic/rtic-monotonics below and as iot-net's own rtic-sync.
[dependencies.rtic-sync]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"
features = ["defmt-03"]
optional = true

[dependencies.rtic]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"
features = ["thumbv8main-backend"]
optional = true

[dependencies.rtic-monotonics]
git = "https://github.com/rtic-rs/rtic.git"
tag = "v2.2.0"
features = ["cortex-m-systick", "defmt"]
optional = true

# Optimize the dev profile.  Two reasons, both load-bearing here:
#   1. Fit: at opt-level 0 the embassy-net/smoltcp async state
#      machines overflow the 256K FLASH region of memory.x (which is
#      copied verbatim from embassy's own N6 example-- itself built
#      at opt-level 3).  Optimizing keeps that region layout intact.
#   2. embassy's async codegen is pathologically large and
#      stack-hungry at opt-level 0; opt-level 3 is the upstream-
#      recommended baseline.
# `debug = 2` is kept so defmt/panic-probe backtraces stay useful.
[profile.dev]
opt-level = 3
debug = 2

# ── embassy graph unification (net feature) ──────────────────────
# `iot-net` (a workspace member, pulled in by the `net` feature)
# resolves its embassy deps to the workspace's crates.io versions.
# Redirect exactly that crates.io subgraph onto the SAME git rev this
# crate pins for embassy-stm32/embassy-net above, so there is one
# embassy graph (one `Stack`/`Runner` type, one linked time driver).
# Every crate below is genuinely present via iot-net's subgraph
# (embassy-net 0.9.1 -> embassy-{time,futures,sync,net-driver} and
# embassy-time -> embassy-time-{driver,queue-utils}); the rev's
# versions equal the crates.io ones, so each patch is semver-clean
# and none is left unused.  Only active under `--features net`; a
# bare `g1-spike` build never pulls iot-net, so the patch simply does
# not apply.  Crate-local: this crate is workspace-excluded with its
# own Cargo.lock.
[patch.crates-io]
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "12e4b1adde4e01b23506822c621451f8e6199c81" }
