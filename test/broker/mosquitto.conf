# Mosquitto MQTT Broker Configuration for TLS Testing

# Run as root inside the container to read bind-mounted certs.
# The Containerfile sets USER root to bypass the entrypoint's
# chown, but mosquitto drops privileges by default.  This is a
# local test broker — production would use proper cert ownership.
user root

# TLS-only listener (port 8883)
listener 8883
protocol mqtt
allow_anonymous true

# TLS configuration — certs mounted from .local/ at container start
cafile /mosquitto/certs/root.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Require TLS 1.2 minimum; TLS 1.3 is preferred and used by
# embedded-tls on the device.  Mosquitto 2.x supports both.
tls_version tlsv1.2

# TLS 1.2 cipher suites (ECDSA-compatible)
# embedded-tls uses TLS 1.3 which negotiates ciphers separately,
# but these are needed if any TLS 1.2 clients connect.
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384

# Require certificate from clients (set to false for testing)
require_certificate false

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
