[package]
name = "smoke-validator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cucumber-RS smoke test validator for RTT and MQTT output"
license = "MIT OR Apache-2.0"

[dependencies]
cucumber = { version = "0.22", features = ["output-junit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
csv = "1"
anyhow = "1"
